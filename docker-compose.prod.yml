# =============================================================================
# Docker Compose — Producción (ThinkCentre / servidor dedicado)
# Uso: npm run docker:prod
#   (docker compose --env-file .env.production -f docker-compose.yml -f docker-compose.prod.yml
#    up -d --build --remove-orphans)
# Imagen compilada (target `production`: node dist/server.js, sin dependencias de desarrollo).
# Con --env-file, Compose toma de .env.production también las variables de este archivo
# (API_BIND_ADDRESS, PORT, REDIS_PASSWORD): un solo archivo para todo.
# =============================================================================
services:
  api:
    # Mismo nombre que el antiguo `api-prod` de docker-compose.dev.yml: Lumia Admin
    # (NUXT_API_BASE_URL=http://server-api:3001) y el asistente lo buscan así en la red Docker.
    container_name: server-api
    env_file:
      - .env.production
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  mongo:
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    deploy:
      resources:
        limits:
          memory: 256M
