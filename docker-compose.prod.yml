# =============================================================================
# Docker Compose — Producción (ThinkCentre / servidor dedicado)
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================
services:
  api:
    env_file:
      - .env.production
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'

  mongo:
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    deploy:
      resources:
        limits:
          memory: 256M
