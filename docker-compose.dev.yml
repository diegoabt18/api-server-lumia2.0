# =============================================================================
# Docker Compose — Desarrollo local (lumia admin → API en Docker)
# =============================================================================
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Usa .env.development. Cookies/CORS para lumia en http://localhost:3002
# (sobrescritos abajo). Mongo local opcional: MONGO_* → mongo:27017 en .env.development
# =============================================================================
services:
  mongo:
    ports:
      - '27017:27017'

  redis:
    ports:
      - '6379:6379'

  api:
    build:
      context: .
      target: builder
    restart: unless-stopped
    command: sh -c "npm install && npm run dev"
    env_file:
      - .env.development
    environment:
      NODE_ENV: development
      APP_URL: http://localhost:3001
      HOST: 0.0.0.0
      PORT: 3001
      FRONTEND_URL: ${LUMIA_ADMIN_URL:-http://localhost:3002}
      CORS_ORIGINS: ${LUMIA_ADMIN_URL:-http://localhost:3002},http://localhost:3000,http://127.0.0.1:3002
      COOKIE_DOMAIN: ''
      COOKIE_SECURE: 'false'
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: 'true'
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.build.json:/app/tsconfig.build.json
    ports:
      - '${PORT:-3001}:3001'
    healthcheck:
      disable: true

  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    networks:
      - lumia-network
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-lumia}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-lumia_secret}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-lumia}:${MONGO_ROOT_PASSWORD:-lumia_secret}@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      mongo:
        condition: service_healthy
